<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>The Wrestling Missing Link</title>
    <style>
        :root {
            --bg-dark: #0a0c0e;
            --panel-bg: #12161a;
            --card-bg: #181e24;
            --border-color: #2a343d;
            --accent-orange: #ff6600;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --accent-gold: #ffaa00;
            --text-main: #f0f4f8;
            --text-muted: #8b9bb0;
            --radius: 8px;
        }

        /* FORCE SCREEN LOCK & PREVENT OVERFLOW */
        html, body {
            width: 100% !important;
            max-width: 100vw !important;
            overflow-x: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(#1e2630 1px, transparent 1px);
            background-size: 24px 24px;
        }

        * {
            box-sizing: border-box !important;
        }

        /* FIXED MOBILE HEADER */
        header {
            background: #0a0c0e !important;
            border-bottom: 2px solid var(--accent-orange) !important;
            padding: 12px !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
            width: 100% !important;
            max-width: 100vw !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8) !important;
        }

        .header-content {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: flex-start !important;
            gap: 10px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .logo-group {
            display: flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            width: 100% !important;
            gap: 8px !important;
            text-align: left !important;
        }

        .logo-icon {
            font-size: 1.4rem !important;
            color: var(--accent-orange) !important;
            flex-shrink: 0 !important;
        }

        h1 {
            font-size: 1.05rem !important;
            font-weight: 900 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            text-align: left !important;
            margin: 0 !important;
            padding: 0 !important;
            white-space: normal !important;
            word-break: break-word !important;
            background: linear-gradient(90deg, #ffffff, var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* MOBILE CONTROLS STACKED CLEANLY */
        .controls {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            gap: 8px !important;
        }

        .search-input {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            padding: 10px 12px !important;
            border-radius: var(--radius) !important;
            width: 100% !important;
            font-size: 0.9rem !important;
        }

        .search-input:focus {
            outline: none !important;
            border-color: var(--accent-orange) !important;
            box-shadow: 0 0 10px var(--accent-orange-glow) !important;
        }

        .btn-row {
            display: flex !important;
            width: 100% !important;
            gap: 8px !important;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-transform: uppercase;
            text-decoration: none;
            flex: 1 !important;
            width: 50% !important;
            text-align: center;
        }

        .btn-orange {
            background: linear-gradient(135deg, #ff6600, #cc5200);
            color: #fff;
            border: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffaa00, #b37700);
            color: #000;
            border: none;
        }

        /* MAIN CONTENT & CARDS */
        .container {
            width: 100% !important;
            max-width: 100vw !important;
            padding: 12px !important;
        }

        .filters {
            display: flex !important;
            gap: 8px !important;
            overflow-x: auto !important;
            padding-bottom: 10px !important;
            margin-bottom: 16px !important;
            border-bottom: 1px solid var(--border-color) !important;
            -webkit-overflow-scrolling: touch !important;
        }

        .filter-chip {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .filter-chip.active {
            background: var(--card-bg);
            color: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .grid {
            display: grid !important;
            grid-template-columns: 1fr !important;
            gap: 12px !important;
            width: 100% !important;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100% !important;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .bookmark-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .bookmark-btn.active { color: var(--accent-gold); }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag-category { background: #2a1f18; color: #ff9933; border: 1px solid #cc5200; }
        .tag-platform { background: #18242a; color: #38bdf8; border: 1px solid #0284c7; }
        .tag-youtube { background: #2a1414; color: #ff4d4d; border: 1px solid #cc0000; }

        .card-actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 2px solid var(--accent-orange);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .spinner-box {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-orange);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border-color);
            margin: 14px 0;
            padding: 10px;
            border-radius: var(--radius);
            background: var(--card-bg);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 100px);
            background: var(--accent-orange);
            color: #fff;
            font-weight: 800;
            padding: 10px 18px;
            border-radius: var(--radius);
            transition: transform 0.3s ease;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.show { transform: translate(-50%, 0); }

        /* DESKTOP RESPONSIVE ADJUSTMENTS */
        @media (min-width: 768px) {
            .header-content {
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
            }
            .controls {
                flex-direction: row !important;
                width: auto !important;
            }
            .search-input { width: 220px !important; }
            .btn-row { width: auto !important; }
            .btn { width: auto !important; flex: none !important; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; }
        }
    </style>
</head>

                <button class="btn" id="closeModalBtn">Close</button>

        </div>
    </div>

        let state = {
            currentCategory: 'all',
            searchQuery: '',
            isGridView: true,
            bookmarks: JSON.parse(localStorage.getItem('wml_bookmarks') || '[]'),
            selectedRandom: null
        };

        const gridEl = document.getElementById('linksGrid');
        const searchInput = document.getElementById('searchInput');

        function render() {
            let filtered = archives.filter(item => {
                const matchesCat = state.currentCategory === 'all' 
                    || (state.currentCategory === 'bookmarks' && state.bookmarks.includes(item.id))
                    || item.cat === state.currentCategory;
                
                const matchesSearch = item.name.toLowerCase().includes(state.searchQuery.toLowerCase())
                    || item.platform.toLowerCase().includes(state.searchQuery.toLowerCase())
                    || item.cat.toLowerCase().includes(state.searchQuery.toLowerCase());

                return matchesCat && matchesSearch;
            });

            gridEl.style.gridTemplateColumns = state.isGridView ? '1fr' : '1fr';

            if (filtered.length === 0) {
                gridEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">No wrestling archives found.</div>`;
                return;
            }

            gridEl.innerHTML = filtered.map(item => {
                const isBookmarked = state.bookmarks.includes(item.id);
                const platformClass = item.platform === 'YouTube' ? 'tag-youtube' : 'tag-platform';
                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${item.name}</div>
                            <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(${item.id})">
                                ${isBookmarked ? '★' : '☆'}
                            </button>
                        </div>
                        <div class="card-tags">
                            <span class="tag tag-category">${item.cat}</span>
                            <span class="tag ${platformClass}">${item.platform}</span>
                        </div>
                        <div class="card-actions">
                            <a href="${item.url}" target="_blank" class="btn btn-orange">Watch Link</a>
                            <button class="btn" onclick="copyToClipboard('${item.url}')">Copy URL</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleBookmark(id) {
            if (state.bookmarks.includes(id)) {
                state.bookmarks = state.bookmarks.filter(bId => bId !== id);
            } else {
                state.bookmarks.push(id);
            }
            localStorage.setItem('wml_bookmarks', JSON.stringify(state.bookmarks));
            render();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            render();
        });

        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-chip')) {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                state.currentCategory = e.target.dataset.cat;
                render();
            }
        });

        document.getElementById('layoutToggle').addEventListener('click', () => {
            state.isGridView = !state.isGridView;
            document.getElementById('layoutToggle').innerText = `Layout: ${state.isGridView ? 'Grid' : 'List'}`;
            render();
        });

        const modal = document.getElementById('randomModal');
        const spinnerText = document.getElementById('spinnerText');
        const launchSelectedBtn = document.getElementById('launchSelectedBtn');

        document.getElementById('randomBtn').addEventListener('click', () => {
            modal.classList.add('active');
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        document.getElementById('spinTriggerBtn').addEventListener('click', () => {
            let counter = 0;
            launchSelectedBtn.style.display = 'none';
            
            const interval = setInterval(() => {
                const randIndex = Math.floor(Math.random() * archives.length);
                spinnerText.innerText = archives[randIndex].name;
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    state.selectedRandom = archives[randIndex];
                    spinnerText.innerText = `🎯 ${state.selectedRandom.name}`;
                    launchSelectedBtn.href = state.selectedRandom.url;
                    launchSelectedBtn.style.display = 'inline-flex';
                }
            }, 80);
        });

        render();
    </script>
